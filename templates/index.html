<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Outreach Tool</title>
</head>
<body>
    <h1>LinkedIn Outreach Tool</h1>
    <form method="POST">
        <label for="profile_url">Profile URL:</label><br>
        <input type="text" id="profile_url" name="profile_url" required><br><br>

        <label for="personal_note">Personal Note:</label><br>
        <textarea id="personal_note" name="personal_note" required></textarea><br><br>

        <button type="submit">Add Outreach Entry</button>
    </form>
</body>
</html>
